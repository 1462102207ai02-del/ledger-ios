name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project LedgerApp.xcodeproj \
            -scheme LedgerApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 只产出一个通用 IPA：TrollStore 直装与真证书工具重签共用同一份包。
      # 关键前提：
      #  - PlugIns/LedgerWidget.appex 必须保留，小组件才存在（与证书无关）
      #  - ldid ad-hoc 伪签写入 App Group，TrollStore 靠 CoreTrust 直接信任该签名
      #  - 真证书工具重签时会覆盖签名，但不会删插件 / 改代码，装的仍是这个包
      - name: Sign and package universal IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LedgerApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          WIDGET_APP="$APP_PATH/PlugIns/LedgerWidget.appex"
          if [ ! -d "$WIDGET_APP" ]; then
            echo "::error::widget appex not embedded"
            exit 1
          fi

          # 隐私清单：主 App 与小组件各放一份
          cp LedgerApp/PrivacyInfo.xcprivacy "$APP_PATH/PrivacyInfo.xcprivacy"
          cp LedgerWidget/PrivacyInfo.xcprivacy "$WIDGET_APP/PrivacyInfo.xcprivacy"

          # 未签名编译不应残留签名目录，清掉后统一由 ldid 生成 ad-hoc 签名
          find "$APP_PATH" -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true

          GROUP="group.com.mazexin.Bookkeeping"
          grep -q "$GROUP" LedgerApp/LedgerApp.entitlements \
            || { echo "::error::App Group missing in app entitlements"; exit 1; }
          grep -q "$GROUP" LedgerWidget/LedgerWidget.entitlements \
            || { echo "::error::App Group missing in widget entitlements"; exit 1; }

          # 唯一一次签名：主 App 与小组件都写入带 App Group 的 ad-hoc 签名
          ldid -SLedgerApp/LedgerApp.entitlements "$APP_PATH/LedgerApp"
          ldid -e "$APP_PATH/LedgerApp" | grep -q "$GROUP" \
            || { echo "::error::App Group not embedded in app signature"; exit 1; }

          ldid -SLedgerWidget/LedgerWidget.entitlements "$WIDGET_APP/LedgerWidget"
          ldid -e "$WIDGET_APP/LedgerWidget" | grep -q "$GROUP" \
            || { echo "::error::App Group not embedded in widget signature"; exit 1; }

          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/LedgerApp.app
          zip -qry LedgerApp.ipa Payload
          ls -lh LedgerApp.ipa

          echo "=== 单包内容核对 ==="
          unzip -l LedgerApp.ipa | grep -iE "PlugIns/LedgerWidget.appex/(Info.plist|LedgerWidget)|PrivacyInfo" || true
          IPA_COUNT="$(find . -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')"
          echo "IPA_COUNT=$IPA_COUNT"
          test "$IPA_COUNT" = "1" || { echo "::error::expected exactly one IPA"; exit 1; }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LedgerApp-IPA
          path: LedgerApp.ipa
          if-no-files-found: error
          retention-days: 30
