name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project LedgerApp.xcodeproj \
            -scheme LedgerApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LedgerApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          # ===== 产物 1：真证书自签裸包（LCSign / 爱思 / AltStore 用）=====
          # 与 TrollStore 版的两点关键差异：
          #  1) 不做 ldid 伪签，避免野生 App Group entitlement 与分发证书/profile 冲突
          #  2) 去掉 widget 扩展——自签后 App Group 失效，widget 本就取不到数据；
          #     且扩展有独立 bundle id，签名证书的描述文件未必覆盖，是安装失败的常见诱因
          # 主 App 数据层有降级：共享容器读不到会回退 Documents，记账主功能不受影响。
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/LedgerApp.app
          # 清理编译期可能残留的签名目录与所有扩展
          find Payload/LedgerApp.app -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          rm -rf Payload/LedgerApp.app/PlugIns
          # 自签不需要隐私清单注入（不走 App Store 审核），但保留也无害，这里保留主 App 的
          zip -qry LedgerApp-Sideload.ipa Payload
          ls -lh LedgerApp-Sideload.ipa
          echo "=== 自签裸包内 PlugIns（应为空）==="
          unzip -l LedgerApp-Sideload.ipa | grep -i "PlugIns" || echo "  (无扩展)"

          # ===== 产物 1.5：真证书自签带组件版（LCSign 用）=====
          # 与裸包的唯一差异：保留 widget 扩展（PlugIns）。
          # 同样不做 ldid 伪签——伪签里的野生 App Group entitlement 会跟真证书/profile 冲突，
          # 这是之前安装失败的主因。App Group 权限改由用户导入 LCSign 的 provisioning profile 决定：
          #   - profile 含 group.com.mazexin.Bookkeeping → 装上后小组件可读到数据
          #   - profile 不含该 group → 小组件会出现但显示空数据
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/LedgerApp.app
          find Payload/LedgerApp.app -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          zip -qry LedgerApp-SideloadWidget.ipa Payload
          ls -lh LedgerApp-SideloadWidget.ipa
          echo "=== 自签带组件版内 PlugIns（应含 LedgerWidget.appex）==="
          unzip -l LedgerApp-SideloadWidget.ipa | grep -i "PlugIns" || echo "  (无扩展，异常)"

          # ===== 产物 2：TrollStore 版（ldid 伪签 + App Group，小组件可用）=====
          cp LedgerApp/PrivacyInfo.xcprivacy "$APP_PATH/PrivacyInfo.xcprivacy"
          WIDGET_APP="$APP_PATH/PlugIns/LedgerWidget.appex"
          test -d "$WIDGET_APP" || { echo "::error::widget appex not embedded"; exit 1; }
          cp LedgerWidget/PrivacyInfo.xcprivacy "$WIDGET_APP/PrivacyInfo.xcprivacy"

          GROUP="group.com.mazexin.Bookkeeping"
          grep -q "$GROUP" LedgerApp/LedgerApp.entitlements \
            || { echo "::error::App Group missing in app entitlements"; exit 1; }
          grep -q "$GROUP" LedgerWidget/LedgerWidget.entitlements \
            || { echo "::error::App Group missing in widget entitlements"; exit 1; }

          ldid -SLedgerApp/LedgerApp.entitlements "$APP_PATH/LedgerApp"
          ldid -e "$APP_PATH/LedgerApp" | grep -q "$GROUP" \
            || { echo "::error::App Group not embedded in app signature"; exit 1; }

          ldid -SLedgerWidget/LedgerWidget.entitlements "$WIDGET_APP/LedgerWidget"
          ldid -e "$WIDGET_APP/LedgerWidget" | grep -q "$GROUP" \
            || { echo "::error::App Group not embedded in widget signature"; exit 1; }

          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/LedgerApp.app
          zip -qry LedgerApp-TrollStore.ipa Payload
          ls -lh LedgerApp-TrollStore.ipa
          echo "=== TrollStore 版内 PlugIns 内容 ==="
          unzip -l LedgerApp-TrollStore.ipa | grep -i "PlugIns" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LedgerApp-TrollStore
          path: |
            LedgerApp-TrollStore.ipa
            LedgerApp-Sideload.ipa
            LedgerApp-SideloadWidget.ipa
          if-no-files-found: error
          retention-days: 30
