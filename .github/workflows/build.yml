name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project LedgerApp.xcodeproj \
            -scheme LedgerApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 只产出一个通用 IPA：TrollStore 直装与真证书工具重签共用同一份包。
      # 关键前提：
      #  - PlugIns/LedgerWidget.appex 必须保留，小组件才存在（与证书无关）
      #  - 二进制签名必须「干净」：不写入任何受限 entitlement。
      #    旧版把 com.apple.security.application-groups 用 ldid 硬写进签名，
      #    p12 重签时 profile 不带同名 App Group，安装校验会直接失败。
      #    小组件数据改由「运行时动态发现的 App Group / Keychain 快照」传递。
      #  - 签名骨架必须「标准」：ldid 只生成二进制里的 CodeDirectory，
      #    不生成 _CodeSignature/CodeResources（资源 seal）。TrollStore 靠
      #    CoreTrust 不校验 seal 所以能装，但 p12 走标准 installd 校验时
      #    缺 seal 会直接判「无法安装」。改用 codesign 生成完整骨架。
      #  - 真证书工具重签时会覆盖签名，但不会删插件 / 改代码，装的仍是这个包
      - name: Sign and package universal IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LedgerApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          WIDGET_APP="$APP_PATH/PlugIns/LedgerWidget.appex"
          if [ ! -d "$WIDGET_APP" ]; then
            echo "::error::widget appex not embedded"
            exit 1
          fi

          # 隐私清单：主 App 与小组件各放一份
          cp LedgerApp/PrivacyInfo.xcprivacy "$APP_PATH/PrivacyInfo.xcprivacy"
          cp LedgerWidget/PrivacyInfo.xcprivacy "$WIDGET_APP/PrivacyInfo.xcprivacy"

          # 未签名编译不产生签名目录，清掉残留后统一生成标准 ad-hoc 签名骨架
          find "$APP_PATH" -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          # 清掉扩展属性，避免 codesign 报 "resource fork / detritus not allowed"
          xattr -cr "$APP_PATH" 2>/dev/null || true

          # codesign -s - 会生成完整的 _CodeSignature/CodeResources（资源 seal），
          # 且同样不写入任何 entitlement，既满足标准 installd 校验，
          # 又不会与重签工具自己的 profile 冲突。
          # 顺序必须是「先签嵌套 appex，再签外层 App」，否则外层 seal 把嵌套代码
          # 记成无效，重签工具可能直接拒绝安装包。
          codesign --force --sign - --timestamp=none "$WIDGET_APP"
          codesign --force --sign - --timestamp=none "$APP_PATH"

          # 硬校验 1：主 App 与小组件都必须有完整的资源 seal
          for bundle in "$APP_PATH" "$WIDGET_APP"; do
            if [ ! -f "$bundle/_CodeSignature/CodeResources" ]; then
              echo "::error::CodeResources missing in $bundle"
              exit 1
            fi
          done
          echo "签名核对：主 App 与小组件均有 CodeResources"

          # 硬校验 2：两个可执行文件的签名里都不能残留受限 App Group。
          for bin in "$APP_PATH/LedgerApp" "$WIDGET_APP/LedgerWidget"; do
            ENT="$(ldid -e "$bin" 2>/dev/null || true)"
            if printf '%s' "$ENT" | grep -q "com.apple.security.application-groups"; then
              echo "::error::restricted App Group entitlement found in $bin"
              exit 1
            fi
          done
          echo "签名核对：主 App 与小组件均不含受限 entitlement"

          # 诊断输出，便于以后凭日志定位安装失败
          codesign -dvv "$APP_PATH" 2>&1 | head -12 || true

          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/LedgerApp.app
          zip -qry LedgerApp.ipa Payload
          ls -lh LedgerApp.ipa

          echo "=== 单包内容核对 ==="
          unzip -l LedgerApp.ipa | grep -iE "PlugIns/LedgerWidget.appex/(Info.plist|LedgerWidget)|PrivacyInfo" || true
          IPA_COUNT="$(find . -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')"
          echo "IPA_COUNT=$IPA_COUNT"
          test "$IPA_COUNT" = "1" || { echo "::error::expected exactly one IPA"; exit 1; }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LedgerApp-IPA
          path: LedgerApp.ipa
          if-no-files-found: error
          retention-days: 30
